<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White n Beige Coffee - Premium Specialty Coffee Roasters</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FDFBF7;
            color: #4A3A0A;
            line-height: 1.6;
        }

        header {
            width: 100%;
            padding: 3rem 2rem;
            text-align: center;
            background-color: #FDFBF7;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .logo-svg {
            width: 200px;
            height: auto;
            max-width: 100%;
        }

        .tagline {
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero {
            background: linear-gradient(135deg, #A89968 0%, #D4C4B0 100%);
            color: #FDFBF7;
            padding: 4rem 2rem;
            text-align: center;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        section {
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
